plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
}

group = mod_group_id
version = "${mc_version}-${mod_version}-${port_version}"
base.archivesName = 'Draconic-Evolution'
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// The bootstrapper uses the same root for dependency checkouts, builds and run directories.
def stage = file(providers.environmentVariable('DE_BUILD_ROOT').getOrElse('.gradle/port-work'))
layout.buildDirectory = new File(stage, 'Draconic-Evolution/build')
def dependencyDir = new File(stage, 'deps')
def coreJar = new File(dependencyDir, "BrandonsCore-${bcore_version}.jar")
def cclJar = new File(dependencyDir, "codechickenlib-${ccl_version}.jar")

def classicRoots = files('src/main/resources/2d_item_models', 'src/main/generated/2d_item_models')
sourceSets.main.resources {
    srcDir 'src/main/generated'
    // Matching assets come from Classic in processResources. Preserve the mod's own pack metadata.
    exclude { entry ->
        entry.path.startsWith('assets/') && classicRoots.any { root -> new File(root, entry.path).isFile() }
    }
}
tasks.named('processResources') {
    from(classicRoots) { include 'assets/**' }
}

def classicResourcePack = tasks.register('classicResourcePack', Zip) {
    from classicRoots
    archiveFileName = "Draconic-Evolution-Classic-16x-${mc_version}.zip"
    destinationDirectory = layout.buildDirectory.dir('distributions')
}
tasks.named('assemble') { dependsOn classicResourcePack }
sourceSets.main.java {
    // These 1.21 authoring tools and the unused prototype renderer are retained for reference.
    exclude 'com/brandon3055/draconicevolution/datagen/**'
    exclude 'com/brandon3055/draconicevolution/client/TestRenderLayer.java'
}

neoForge {
    version = project.neo_version
    accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')
    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
        serverData { serverData() }
        clientData { clientData() }
        configureEach {
            gameDirectory = new File(stage, "run/${name}")
            if (name.endsWith('Data')) {
                programArguments.addAll '--mod', project.mod_id, '--all',
                        '--output', file('src/main/generated').absolutePath,
                        '--existing', file('src/main/resources').absolutePath
            }
        }
    }
    mods {
        "${mod_id}" { sourceSet sourceSets.main }
    }
    unitTest {
        enable()
        testedMod = mods.named(mod_id)
    }
}

repositories {
    def mirror = new File(stage, 'mirror')
    if (mirror.isDirectory()) {
        maven {
            url = mirror.toURI()
            metadataSources { mavenPom(); ignoreGradleMetadataRedirection() }
            content { includeGroup 'cc.tweaked'; includeGroup 'top.theillusivec4.curios' }
        }
    }
    def central = mavenCentral()
    exclusiveContent {
        forRepositories(central)
        filter {
            includeGroupByRegex 'org[.]junit([.].*)?'
            includeGroup 'org.opentest4j'
            includeGroup 'org.apiguardian'
        }
    }
    maven {
        url = uri('https://maven.covers1624.net/')
        content { includeGroup 'net.covers1624' }
    }
    maven {
        url = uri('https://maven.theillusivec4.top/')
        content { includeGroup 'top.theillusivec4.curios' }
    }
    maven {
        url = uri('https://maven.squiddev.cc/')
        content { includeGroup 'cc.tweaked' }
    }
    maven {
        url = uri('https://api.modrinth.com/maven')
        content { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    implementation files(coreJar, cclJar)
    // CodeChickenLib embeds Quack for installed users. Supply it explicitly to javac.
    compileOnly 'net.covers1624:Quack:0.4.10.130'

    compileOnly "maven.modrinth:pf-emi:${emi_version}"
    compileOnly "maven.modrinth:jade:${jade_version}"
    compileOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}:api"
    compileOnly "cc.tweaked:cc-tweaked-${mc_version}-forge-api:${cct_version}"
    if (providers.gradleProperty('withOptionalMods').isPresent()) {
        runtimeOnly "maven.modrinth:pf-emi:${emi_version}"
        runtimeOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}"
    }
    // EnderCollection discovers the optional EnderStorage API reflectively.
    if (providers.gradleProperty('enderStorageJar').isPresent()) {
        runtimeOnly files(providers.gradleProperty('enderStorageJar').get())
    }
    testImplementation platform('org.junit:junit-bom:5.12.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

sourceSets.test.compileClasspath += sourceSets.main.output

def testGameDir = new File(stage, 'run/junit')
tasks.named('prepareNeoForgeTestFiles') {
    gameDirectory = testGameDir
}
tasks.named('test') {
    useJUnitPlatform()
}
// ModDev sets this after project evaluation. Keep its launch arguments and working directory in sync.
afterEvaluate {
    tasks.named('test') { workingDir = testGameDir }
}

def metadata = [
        minecraft_version_range: minecraft_version_range, neo_version_range: neo_version_range,
        loader_version_range: loader_version_range, mod_id: mod_id, mod_name: mod_name,
        mod_license: mod_license, mod_version: "${mod_version}-${port_version}",
        mod_authors: mod_authors, mod_description: mod_description
]
def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    inputs.properties metadata
    expand metadata
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xmaxerrs', '10000'])
}
tasks.named('compileJava') {
    doFirst {
        [coreJar, cclJar].each { dependency ->
            if (!dependency.isFile()) {
                throw new GradleException("Missing ${dependency.name}. Run python gradle/build-port.py build to prepare the pinned dependencies.")
            }
        }
    }
}

tasks.named('jar') {
    from 'LICENSE.md'
    manifest {
        attributes 'Implementation-Title': 'Draconic Evolution',
                'Implementation-Version': project.version,
                'Implementation-Vendor': 'brandon3055 and contributors',
                'MixinConfigs': 'mixins.draconicevolution.json'
    }
}
